[project]
name = "geng-agent"
version = "0.2.0"
description = "A local-first system for communication-paper engineering reproducibility review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0.0",
  "pydantic>=2.7",
  "pillow>=10",
  "pymupdf>=1.24",
  "python-docx>=1.1"
]

[project.optional-dependencies]
openhands = [
  "openhands-sdk>=1.24.0",
  "openhands-tools>=1.24.0"
]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "celery[redis]>=5.4",
  "redis>=5.2",
  "psycopg[binary]>=3.2"
]
repro = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "reedsolo>=1.7",
  "pandas>=2.0",
  "sympy>=1.12",
  "numba>=0.59",
  "scikit-commpy>=0.8",
  "galois>=0.3",
  "networkx>=3.0",
  "h5py>=3.10",
  "tqdm>=4.66"
]

[project.scripts]
geng-agent = "geng_agent.cli:main"
geng-agent-web = "geng_agent.web.__main__:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geng_agent*"]

[tool.setuptools.package-data]
geng_agent = [
  "prompts/*.md",
  "web/static/*",
  "web/frontend/dist/*",
  "web/frontend/dist/assets/*",
  "web/migrations/*.py",
  "web/migrations/versions/*.py"
]
