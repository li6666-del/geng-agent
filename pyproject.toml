[project]
name = "geng-agent"
version = "0.1.0"
description = "A local CLI agent for communication-paper engineering reproducibility review."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf>=5.0.0",
  "pydantic>=2.7",
  "pillow>=10",
  "pymupdf>=1.24",
  "python-docx>=1.1"
]

[project.optional-dependencies]
web = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
]
# Libraries the generated reproduction code is allowed to import. Single source of
# truth for the allow-list is geng_agent/security.ALLOWED_REQUIREMENTS; this extra
# makes them installable in one command. tests/test_preflight.py asserts the two
# stay in sync. Without these, every numpy paper falls back to the local template.
repro = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7",
  "scikit-learn>=1.3",
  "reedsolo>=1.7",
  "pandas>=2.0",
  "sympy>=1.12",
  "numba>=0.59",
  "torch>=2.0",
  "scikit-commpy>=0.8",
  "galois>=0.3",
  "networkx>=3.0",
  "h5py>=3.10",
  "tqdm>=4.66",
]

[project.scripts]
geng-agent = "geng_agent.cli:main"
geng-agent-web = "geng_agent.web.__main__:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geng_agent*"]

[tool.setuptools.package-data]
geng_agent = ["prompts/*.md", "web/static/*"]
