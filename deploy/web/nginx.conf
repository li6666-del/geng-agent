server {
    listen 80;
    listen [::]:80;
    server_name bupt-gengagent.cn www.bupt-gengagent.cn;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/geng-acme;
        default_type text/plain;
    }
    location / { return 301 https://bupt-gengagent.cn$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.bupt-gengagent.cn;
    ssl_certificate /etc/letsencrypt/live/bupt-gengagent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bupt-gengagent.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://bupt-gengagent.cn$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bupt-gengagent.cn;
    ssl_certificate /etc/letsencrypt/live/bupt-gengagent.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bupt-gengagent.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 82m;
    client_body_timeout 300s;
    access_log /var/log/nginx/geng-agent-access.log;
    error_log /var/log/nginx/geng-agent-error.log;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    location ^~ /api/v1/worker/ {
        client_max_body_size 2050m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8768;
    }
    location / {
        proxy_pass http://127.0.0.1:8768;
    }
}
