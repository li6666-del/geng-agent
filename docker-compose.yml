services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: geng
      POSTGRES_USER: geng
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geng-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geng -d geng"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    ports:
      - "8765:8765"
    environment: &geng-env
      GENG_DATABASE_URL: postgresql+psycopg://geng:${POSTGRES_PASSWORD:-geng-local-only}@postgres:5432/geng
      GENG_REDIS_URL: redis://redis:6379/0
      GENG_CASES_ROOT: /data/cases
      GENG_LLM_API_KEY: ${GENG_LLM_API_KEY:-}
      GENG_LLM_BASE_URL: ${GENG_LLM_BASE_URL:-https://api.openai.com/v1}
      GENG_LLM_MODEL: ${GENG_LLM_MODEL:-}
      GENG_ENABLE_URL_IMPORT: ${GENG_ENABLE_URL_IMPORT:-false}
    volumes:
      - cases-data:/data/cases
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: ["celery", "-A", "geng_agent.web.tasks:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment: *geng-env
    volumes:
      - cases-data:/data/cases
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
  cases-data:
