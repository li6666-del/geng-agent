<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>耿同学agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg0: #eef2ff;
      --bg1: #f8fafc;
      --card: rgba(255, 255, 255, 0.92);
      --text: #0f172a;
      --muted: #64748b;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --line: #e2e8f0;
      --done: #059669;
      --done-bg: #ecfdf5;
      --run: #2563eb;
      --run-bg: #eff6ff;
      --fail: #dc2626;
      --fail-bg: #fef2f2;
      --shadow: 0 4px 24px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Noto Sans SC", system-ui, "Microsoft YaHei", sans-serif;
      color: var(--text);
      line-height: 1.6;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(99, 102, 241, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 100% 0%, rgba(14, 165, 233, 0.1), transparent),
        linear-gradient(180deg, var(--bg0) 0%, var(--bg1) 45%, var(--bg1) 100%);
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    .header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: var(--accent);
      background: rgba(79, 70, 229, 0.1);
      border: 1px solid rgba(79, 70, 229, 0.15);
      padding: 0.25rem 0.65rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    h1 {
      font-size: 1.65rem;
      font-weight: 600;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }

    .sub {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0;
      max-width: 28em;
      margin-left: auto;
      margin-right: auto;
    }

    .card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: var(--radius);
      padding: 1.5rem 1.35rem;
      margin-bottom: 1rem;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: none;
      letter-spacing: 0.02em;
      margin: 0 0 1rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .field { margin-bottom: 1rem; }

    input[type="url"] {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 0.95rem;
      font-family: inherit;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="url"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .upload-zone {
      position: relative;
      border: 1.5px dashed #cbd5e1;
      border-radius: 10px;
      padding: 1.1rem 1rem;
      text-align: center;
      background: #fafbfc;
      transition: border-color 0.2s, background 0.2s;
    }

    .upload-zone:hover,
    .upload-zone:focus-within {
      border-color: var(--accent);
      background: var(--run-bg);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
    }

    .upload-text {
      font-size: 0.88rem;
      color: var(--muted);
      pointer-events: none;
    }

    .upload-text strong {
      color: var(--accent);
      font-weight: 500;
    }

    #file-name {
      display: block;
      margin-top: 0.35rem;
      font-size: 0.8rem;
      color: var(--text);
      font-weight: 500;
    }

    .or {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      margin: 0.25rem 0 1rem;
    }

    .or::before,
    .or::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    .btn-primary {
      width: 100%;
      margin-top: 0.25rem;
      padding: 0.75rem 1rem;
      background: linear-gradient(135deg, var(--accent) 0%, #6366f1 100%);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.35);
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.05);
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.4);
      transform: translateY(-1px);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      box-shadow: none;
    }

    .hint {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.85rem;
      padding: 0.5rem 0.65rem;
      background: #f1f5f9;
      border-radius: 8px;
      line-height: 1.45;
    }

    .alert {
      font-size: 0.88rem;
      margin-top: 0.75rem;
      padding: 0.6rem 0.75rem;
      border-radius: 8px;
    }

    .alert.err {
      color: #b91c1c;
      background: var(--fail-bg);
      border: 1px solid #fecaca;
    }

    .alert.ok {
      color: #047857;
      background: var(--done-bg);
      border: 1px solid #a7f3d0;
    }

    .hidden { display: none !important; }

    /* —— 进度区 —— */
    .status-row {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 1rem;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 2.5px solid #e2e8f0;
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
      flex-shrink: 0;
    }

    .spinner.done { animation: none; border-color: var(--done); border-top-color: var(--done); }
    .spinner.fail { animation: none; border-color: var(--fail); border-top-color: var(--fail); }

    @keyframes spin { to { transform: rotate(360deg); } }

    #run-status {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 0;
      flex: 1;
    }

    .progress-track {
      height: 4px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1.25rem;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #38bdf8);
      border-radius: 999px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .progress-meta {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: right;
      margin-top: -1rem;
      margin-bottom: 1rem;
    }

    .timeline {
      list-style: none;
      padding: 0;
      margin: 0;
      position: relative;
    }

    .timeline::before {
      content: "";
      position: absolute;
      left: 15px;
      top: 12px;
      bottom: 12px;
      width: 2px;
      background: linear-gradient(180deg, var(--line) 0%, var(--line) 100%);
    }

    .timeline li {
      position: relative;
      display: flex;
      align-items: flex-start;
      gap: 0.85rem;
      padding: 0.5rem 0 0.5rem 2.5rem;
      font-size: 0.92rem;
      transition: background 0.25s;
      border-radius: 8px;
    }

    .timeline li.running {
      background: var(--run-bg);
    }

    .timeline li.done .step-icon {
      background: var(--done);
      color: #fff;
      border-color: var(--done);
    }

    .timeline li.running .step-icon {
      background: #fff;
      border-color: var(--run);
      color: var(--run);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.15);
      animation: pulse 1.5s ease infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); }
      50% { box-shadow: 0 0 0 7px rgba(37, 99, 235, 0.08); }
    }

    .step-icon {
      position: absolute;
      left: 6px;
      top: 0.55rem;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: #fff;
      font-size: 0.65rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      z-index: 1;
    }

    .step-body { flex: 1; min-width: 0; }

    .step-label { font-weight: 500; }

    .step-state {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }

    .timeline li.running .step-state { color: var(--run); font-weight: 500; }
    .timeline li.done .step-state { color: var(--done); }

    .result-box {
      margin-top: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-size: 0.85rem;
      line-height: 1.55;
      word-break: break-all;
    }

    .result-box code {
      font-size: 0.8rem;
      background: rgba(0, 0, 0, 0.05);
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
    }

    .disclaimer {
      text-align: center;
      font-size: 0.72rem;
      color: #94a3b8;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>
  <main>
    <header class="header">
      <span class="badge">论文工程复现审查</span>
      <h1>耿同学agent</h1>
      <p class="sub">上传 PDF 或填写链接即可，全程自动运行；此处仅展示实时阶段进度。</p>
    </header>

    <section class="card" id="form-card">
      <p class="card-title">提交论文</p>

      <div class="field">
        <label for="pdf-url">PDF 链接</label>
        <input type="url" id="pdf-url" placeholder="https://arxiv.org/pdf/xxxx.pdf" autocomplete="off" />
      </div>

      <p class="or">或</p>

      <div class="field">
        <label>本地 PDF 文件</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="pdf-file" accept="application/pdf,.pdf" />
          <span class="upload-text">点击或拖拽到此处<br /><strong>选择 PDF 文件</strong></span>
          <span id="file-name" class="hidden"></span>
        </div>
      </div>

      <button type="button" class="btn-primary" id="start-btn">开始审查</button>
      <p class="hint" id="health-hint">正在检查服务…</p>
      <p class="alert err hidden" id="form-error"></p>
    </section>

    <section class="card hidden" id="progress-card">
      <div class="status-row">
        <div class="spinner" id="status-spinner" aria-hidden="true"></div>
        <p id="run-status">运行中…</p>
      </div>
      <div class="progress-track" aria-hidden="true">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <p class="progress-meta" id="progress-meta">0 / 9</p>
      <ul class="timeline" id="steps"></ul>
      <div class="result-box hidden" id="result-msg"></div>
    </section>

    <p class="disclaimer">本工具仅评估复现风险，不判定论文真伪。</p>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const stateLabels = {
      pending: "等待",
      running: "进行中",
      done: "已完成",
      skipped: "已跳过",
    };

    $("pdf-file").addEventListener("change", () => {
      const file = $("pdf-file").files[0];
      const nameEl = $("file-name");
      if (file) {
        nameEl.textContent = file.name;
        nameEl.classList.remove("hidden");
        $("pdf-url").value = "";
      } else {
        nameEl.classList.add("hidden");
      }
    });

    $("pdf-url").addEventListener("input", () => {
      if ($("pdf-url").value.trim()) {
        $("pdf-file").value = "";
        $("file-name").classList.add("hidden");
      }
    });

    async function checkHealth() {
      try {
        const res = await fetch("/api/health");
        const data = await res.json();
        if (!data.ok) {
          $("health-hint").textContent = "Codex CLI 不可用：" + (data.codex_error || "请安装 Codex CLI 或设置 GENG_CODEX_CMD");
        } else {
          $("health-hint").textContent = "Codex：" + data.codex_path + "；输出目录：" + data.cases_root;
        }
        if (data.active_run_id) {
          $("start-btn").disabled = true;
          $("form-error").textContent = "已有任务在运行，请稍候。";
          $("form-error").classList.remove("hidden");
        }
      } catch {
        $("health-hint").textContent = "无法连接服务，请确认已启动 geng-agent-web";
      }
    }

    function renderSteps(stages) {
      const doneCount = stages.filter((s) => s.state === "done").length;
      const total = stages.length;
      const running = stages.find((s) => s.state === "running");
      const pct = total ? Math.round((doneCount / total) * 100) : 0;

      $("progress-fill").style.width = (running ? Math.max(pct, 8) : pct) + "%";
      $("progress-meta").textContent = doneCount + " / " + total + (running ? " · 当前：" + running.label : "");

      $("steps").innerHTML = stages
        .map((s, i) => {
          const icon = s.state === "done" ? "✓" : String(i + 1);
          return (
            '<li class="' +
            s.state +
            '">' +
            '<span class="step-icon">' +
            icon +
            "</span>" +
            '<div class="step-body">' +
            '<div class="step-label">' +
            s.label +
            "</div>" +
            '<div class="step-state">' +
            (stateLabels[s.state] || s.state) +
            "</div>" +
            "</div></li>"
          );
        })
        .join("");
    }

    function setRunHeader(text, kind) {
      $("run-status").textContent = text;
      const sp = $("status-spinner");
      sp.classList.remove("done", "fail");
      if (kind === "done") sp.classList.add("done");
      else if (kind === "fail") sp.classList.add("fail");
    }

    function showError(msg) {
      $("form-error").textContent = msg;
      $("form-error").classList.remove("hidden");
    }

    $("start-btn").addEventListener("click", async () => {
      $("form-error").classList.add("hidden");
      const url = $("pdf-url").value.trim();
      const file = $("pdf-file").files[0];
      if (!url && !file) {
        showError("请上传 PDF 或填写链接。");
        return;
      }
      if (url && file) {
        showError("请只选择一种方式。");
        return;
      }

      const fd = new FormData();
      if (file) fd.append("pdf_file", file);
      else fd.append("pdf_url", url);

      $("start-btn").disabled = true;
      try {
        const res = await fetch("/api/runs", { method: "POST", body: fd });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || res.statusText);
        startStream(data.run_id);
      } catch (e) {
        showError(e.message || String(e));
        $("start-btn").disabled = false;
      }
    });

    function startStream(runId) {
      $("form-card").classList.add("hidden");
      $("progress-card").classList.remove("hidden");
      $("result-msg").classList.add("hidden");
      setRunHeader("正在审查…", "run");
      $("progress-fill").style.width = "4%";

      const es = new EventSource("/api/runs/" + runId + "/stream");
      es.onmessage = (ev) => {
        const data = JSON.parse(ev.data);
        if (data.stages) renderSteps(data.stages);
        if (data.type === "finished") {
          es.close();
          $("start-btn").disabled = false;
          if (data.ok) {
            setRunHeader("审查完成", "done");
            $("progress-fill").style.width = "100%";
            $("result-msg").innerHTML =
              "报告已生成。<br>输出目录：<code>" +
              data.case_dir +
              "</code>" +
              (data.review_path ? "<br>主报告：<code>" + data.review_path + "</code>" : "");
            $("result-msg").className = "result-box alert ok";
          } else {
            setRunHeader("审查失败", "fail");
            $("result-msg").textContent = data.error || "未知错误";
            $("result-msg").className = "result-box alert err";
          }
          $("result-msg").classList.remove("hidden");
        }
        if (data.type === "error") {
          es.close();
          setRunHeader("出错", "fail");
          $("result-msg").textContent = data.message;
          $("result-msg").className = "result-box alert err";
          $("result-msg").classList.remove("hidden");
          $("start-btn").disabled = false;
        }
      };
      es.onerror = () => {
        es.close();
        fetch("/api/runs/" + runId)
          .then((r) => r.json())
          .then((d) => {
            if (d.stages) renderSteps(d.stages);
            if (d.status === "succeeded" || d.status === "failed") {
              setRunHeader(d.status === "succeeded" ? "审查完成" : "审查失败", d.status === "succeeded" ? "done" : "fail");
              $("result-msg").textContent = d.error || (d.review_path ? "报告：" + d.review_path : "");
              $("result-msg").className = "result-box alert " + (d.status === "succeeded" ? "ok" : "err");
              $("result-msg").classList.remove("hidden");
            }
          })
          .catch(() => {});
        $("start-btn").disabled = false;
      };
    }

    checkHealth();
  </script>
</body>
</html>
